<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - Portal Pastaza</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 rounded-full mb-3">
        <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 7a2 2 0 012 2m-9 8h10M3 5h18a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V7a2 2 0 012-2z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-800">Restablecer Contraseña</h1>
      <p class="text-gray-500 text-sm mt-1">Portal Cautivo Administrativo</p>
    </div>

    <!-- Mensajes de Carga y Errores Iniciales -->
    <div id="status-loading" class="text-center py-6 text-gray-600 font-medium">
      <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto mb-3" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Validando enlace de recuperación...
    </div>

    <div id="status-error" class="hidden text-center py-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-red-100 text-red-600 rounded-full mb-3">!</div>
      <h3 class="font-bold text-gray-800">Enlace Inválido</h3>
      <p id="error-message-text" class="text-sm text-gray-500 mt-1">El enlace ha expirado o es incorrecto.</p>
      <a href="admin.html" class="mt-6 inline-block text-sm text-blue-600 hover:underline font-semibold">Ir al Inicio de Sesión</a>
    </div>

    <!-- Formulario de Cambio de Contraseña (Oculto inicialmente) -->
    <form id="form-reset-password" class="hidden space-y-4">
      <div id="reset-error" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>
      <div id="reset-success" class="hidden p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm font-semibold text-center"></div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
        <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
        <input type="password" id="confirm-password" placeholder="Confirmar contraseña" required
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800">
      </div>

      <!-- Campo 2FA Condicional -->
      <div id="tfa-section" class="hidden border-t border-gray-100 pt-3">
        <div class="p-3 bg-blue-50 text-blue-700 rounded-lg text-xs leading-relaxed font-medium mb-3">
          Su cuenta tiene activa la protección 2FA. Ingrese el código de 6 dígitos para autorizar el cambio de contraseña.
        </div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Código de Seguridad 2FA</label>
        <input type="text" id="tfa-code" placeholder="ej: 123456" maxlength="8"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg font-bold tracking-widest text-gray-800">
      </div>

      <button type="submit" id="btn-submit-reset"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors pt-2">
        Restablecer Contraseña
      </button>
    </form>
  </div>

  <script>
    // Extraer token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    window.addEventListener('DOMContentLoaded', async () => {
      if (!token) {
        showError('Enlace inválido. No se ha proporcionado un token de recuperación.');
        return;
      }

      try {
        const res = await fetch('/admin/api/reset-password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || 'El enlace ha expirado o es inválido.');
        }

        // Carga exitosa: ocultar loader y mostrar formulario
        document.getElementById('status-loading').classList.add('hidden');
        document.getElementById('form-reset-password').classList.remove('hidden');
        
        // Si requiere 2FA, mostrar sección
        if (data.tfaRequired) {
          document.getElementById('tfa-section').classList.remove('hidden');
          document.getElementById('tfa-code').required = true;
        }

      } catch (err) {
        showError(err.message);
      }
    });

    document.getElementById('form-reset-password').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const tfaCode = document.getElementById('tfa-code').value.trim();
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      
      errEl.classList.add('hidden');
      succEl.classList.add('hidden');

      if (newPassword !== confirmPassword) {
        errEl.textContent = 'Las contraseñas ingresadas no coinciden.';
        errEl.classList.remove('hidden');
        return;
      }

      try {
        document.getElementById('btn-submit-reset').disabled = true;
        document.getElementById('btn-submit-reset').textContent = 'Guardando cambios...';

        const res = await fetch('/admin/api/reset-password/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, tfaCode })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al restablecer la contraseña.');
        }

        // Éxito
        succEl.textContent = '✓ Contraseña restablecida con éxito. Redireccionando al login...';
        succEl.classList.remove('hidden');
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 3000);

      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        document.getElementById('btn-submit-reset').disabled = false;
        document.getElementById('btn-submit-reset').textContent = 'Restablecer Contraseña';
      }
    });

    function showError(message) {
      document.getElementById('status-loading').classList.add('hidden');
      document.getElementById('status-error').classList.remove('hidden');
      document.getElementById('error-message-text').textContent = message;
    }
  </script>
</body>
</html>
